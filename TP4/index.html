<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Géolocalisation et 3D avec Three.js</title>
  <style>body { margin: 0; }</style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</head>
<body>

    <div id="map" style="position: absolute; width: 500px; height: 500px; top: 0; left: 0;"></div>

	<script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>

	<script type="importmap">
        {
          "imports": {
                "three": "https://unpkg.com/three@0.148.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/"
          }
        }
    </script>

  	<script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2,0,5);

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        scene.add(light);

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('./map.jpg');

        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({ map: earthTexture });
        const earth = new THREE.Mesh(geometry, material);
        earth.position.set(0,0,0);
        scene.add(earth);

        const controls = new OrbitControls( camera, renderer.domElement );

        const loader = new GLTFLoader();
        loader.load('./Duck.gltf', (gltf) => {
            const duck = gltf.scene;
            duck.scale.set(0.05, 0.05, 0.05); 

            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                const pos = latLonToCartesian(latitude, longitude, 1.02);
                duck.position.set(pos.x, pos.y, pos.z);
                scene.add(duck);
            });
        });

        function latLonToCartesian(lat, lon, radius = 1) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const y = radius * Math.cos(phi);
            const z = radius * Math.sin(phi) * Math.sin(theta);

            return { x, y, z };
        }

        async function getCountryFlag(country) {
            const flagTexture = textureLoader.load(country.flags.png);
            const markerMaterial = new THREE.MeshBasicMaterial({ map: flagTexture });

            const markerGeometry = new THREE.SphereGeometry(0.02, 16, 16);
            const marker = new THREE.Mesh(markerGeometry, markerMaterial);

            const lat = country.latlng[0];
            const lon = country.latlng[1];
            const pos = latLonToCartesian(lat, lon, 1.02);

            marker.position.set(pos.x, pos.y, pos.z);
            scene.add(marker);
        }

        async function getCountriesDataWithFlags() {
            const response = await fetch('https://restcountries.com/v3.1/all');
            const countries = await response.json();

            countries.forEach(country => {
                getCountryFlag(country);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }



        function repositionEarth(lat, lon) {
            const position = latLonToCartesian(lat, lon, 2);  

            camera.position.set(position.x, position.y, position.z);
            camera.lookAt(0, 0, 0); 
        }

        const map = L.map('map').setView([20, 0], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lon = e.latlng.lng;
            repositionEarth(lat, lon);
        });


        getCountriesDataWithFlags();
        animate();

  </script>
</body>
